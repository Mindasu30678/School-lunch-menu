name: Build APK

on:
  push:
    branches: [ claude/android-camera-app-AolLx, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Debug SDK environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls $ANDROID_HOME/platforms/ 2>&1 || echo "no platforms"
          ls $ANDROID_HOME/build-tools/ 2>&1 || echo "no build-tools"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android-camera/local.properties

      - name: Download Gradle 8.0
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.0-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/
          /opt/gradle-8.0/bin/gradle --version

      - name: Build debug APK
        working-directory: android-camera
        run: |
          /opt/gradle-8.0/bin/gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SilentCamera-debug
          path: android-camera/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 7
