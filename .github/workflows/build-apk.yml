name: Build APK

on:
  push:
    branches: [ claude/android-camera-app-AolLx, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle 8.0
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.0'

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android-camera/local.properties

      - name: Build debug APK
        working-directory: android-camera
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SilentCamera-debug
          path: android-camera/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
